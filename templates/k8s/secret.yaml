# --- Day 19 template: move to k8s/secret.yaml ---
# IMPORTANT: values here are base64-ENCODED, not encrypted.
# Never commit real credentials this way in a real project — use a secrets
# manager (e.g. Sealed Secrets, Vault, or your cloud provider's secret store).
#
# To generate a value: echo -n 'mypassword' | base64

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  DATABASE_PASSWORD: cG9zdGdyZXM=  # "postgres" base64-encoded, replace me
